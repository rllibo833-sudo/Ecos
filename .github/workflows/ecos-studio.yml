name: ECOS Studio CI
on:
  push:
    paths:
      - 'ecos-studio/**'
      - '.github/workflows/ecos-studio.yml'
  pull_request:
    paths:
      - 'ecos-studio/**'
      - '.github/workflows/ecos-studio.yml'
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native viewport dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S ecos-studio -B build/ecos-studio -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ecos-studio --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build/ecos-studio --output-on-failure
      - name: Verify native editor executable
        run: test -x build/ecos-studio/ecos-studio-editor
      - name: Package Linux tools
        run: cmake --build build/ecos-studio --target package
      - uses: actions/upload-artifact@v4
        with:
          name: ECOS-Studio-Linux
          path: build/ecos-studio/ECOS-Studio-*
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native Windows build
        run: cmake -S ecos-studio -B build/ecos-studio -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Windows executables
        run: cmake --build build/ecos-studio --config Release --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build/ecos-studio -C Release --output-on-failure
      - name: Verify native editor executable
        shell: pwsh
        run: if (!(Test-Path "build/ecos-studio/Release/ecos-studio-editor.exe")) { throw "Native editor executable missing" }
      - name: Package Windows tools
        run: cpack --config build/ecos-studio/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: ECOS-Studio-Windows
          path: ECOS-Studio-*
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native macOS app
        run: cmake -S ecos-studio -B build/ecos-studio -DCMAKE_BUILD_TYPE=Release
      - name: Build native macOS app
        run: cmake --build build/ecos-studio --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build/ecos-studio --output-on-failure
      - name: Verify native editor bundle
        run: test -d "build/ecos-studio/ECOS Studio.app"
      - name: Package macOS app
        run: cpack --config build/ecos-studio/CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: ECOS-Studio-macOS
          path: ECOS-Studio-*
