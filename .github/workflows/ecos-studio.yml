name: ECOS Studio CI
on:
  push:
    paths:
      - 'ecos-studio/**'
      - '.github/workflows/ecos-studio.yml'
  pull_request:
    paths:
      - 'ecos-studio/**'
      - '.github/workflows/ecos-studio.yml'
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ecos-studio -B build/ecos-studio -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ecos-studio --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build/ecos-studio --output-on-failure
      - name: Render sample mesh to image
        run: |
          build/ecos-studio/ecos-studio mesh-render ecos-studio/examples/hello-world/assets/triangle.obj /tmp/ecos-studio-triangle.ppm 160 120
          test -s /tmp/ecos-studio-triangle.ppm
      - name: Validate sample scene
        run: build/ecos-studio/ecos-studio scene-validate ecos-studio/examples/hello-world/scenes/main.ecscene
      - name: Validate sample world manifest
        run: build/ecos-studio/ecos-studio world-validate ecos-studio/examples/large-world/world.ecworld
      - name: Instantiate and inspect sample world
        run: build/ecos-studio/ecos-studio world-inspect ecos-studio/examples/large-world/world.ecworld
      - name: Load and validate every sample world cell
        run: build/ecos-studio/ecos-studio world-validate-content ecos-studio/examples/large-world/world.ecworld
      - name: Create and validate project scaffold
        run: |
          build/ecos-studio/ecos-studio new /tmp/ecos-studio-sample "ECOS Sample"
          build/ecos-studio/ecos-studio validate /tmp/ecos-studio-sample
      - name: Create and validate mod scaffold
        run: |
          build/ecos-studio/ecos-studio mod-init /tmp/ecos-studio-mod com.ecos.sample
          build/ecos-studio/ecos-studio mod-validate /tmp/ecos-studio-mod

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native Windows build
        run: cmake -S ecos-studio -B build/ecos-studio -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Windows executable
        run: cmake --build build/ecos-studio --config Release --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build/ecos-studio -C Release --output-on-failure
